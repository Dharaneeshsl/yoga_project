<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cobraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Zen Circle -->
  <circle cx="200" cy="150" r="120" fill="#f0fdfa" opacity="0.8" />
  <circle cx="200" cy="150" r="95" fill="none" stroke="#ccfbf1" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Ground -->
  <line x1="30" y1="260" x2="370" y2="260" stroke="#0f766e" stroke-width="3" stroke-linecap="round" />

  <!-- Cobra Pose (Bhujangasana):
       Pelvis/Legs grounded on floor: Feet at (70, 260), Knees at (120, 260), Hips/Pelvis at (180, 255)
       Torso arches gracefully up from Pelvis (180, 255) through spine to Chest/Shoulders (270, 165)
       Head looks gently forward/up at (285, 125)
       Arms: Hands on mat beneath shoulders at (260, 260), Elbows bent close to ribs at (255, 205)
  -->

  <!-- Head -->
  <circle cx="285" cy="125" r="16" fill="url(#cobraGrad)" />

  <!-- Legs & Feet flat on ground -->
  <!-- Feet -->
  <path d="M60 260 L85 260" stroke="#115e59" stroke-width="8" stroke-linecap="round" />
  <!-- Ankles to Knees -->
  <line x1="75" y1="260" x2="130" y2="260" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
  <!-- Knees to Hips/Pelvis -->
  <line x1="130" y1="260" x2="185" y2="255" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />

  <!-- Graceful Arching Spine (Pelvis to Shoulders) -->
  <path d="M185 255 Q 230 240 270 170" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />

  <!-- Arms (Hands on floor, elbows hugged into sides) -->
  <!-- Hands on mat -->
  <path d="M245 260 L275 260" stroke="#115e59" stroke-width="7" stroke-linecap="round" />
  <!-- Wrist to Elbow -->
  <line x1="260" y1="260" x2="252" y2="205" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" />
  <!-- Elbow to Shoulder -->
  <line x1="252" y1="205" x2="270" y2="170" stroke="#14b8a6" stroke-width="7" stroke-linecap="round" />

  <!-- Joint Keypoints -->
  <circle cx="185" cy="255" r="5" fill="#2dd4bf" />
  <circle cx="270" cy="170" r="5" fill="#2dd4bf" />
  <circle cx="252" cy="205" r="5" fill="#2dd4bf" />
</svg>
